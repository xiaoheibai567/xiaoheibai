[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manual-pilot"
version = "1.0.0"
description = "Document RAG and tool-calling assistant for hardware manuals"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3", "python-multipart>=0.0.18,<1",
  "pypdf>=5,<7", "python-docx>=1.1,<2", "sqlite-vec>=0.1.6,<0.2",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "reportlab>=4,<5"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"static" = "app/static"
"examples" = "app/examples"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
